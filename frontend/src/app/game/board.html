<svg class="board" viewBox="0 0 15 15" role="img" aria-label="Ludo board">
  <defs>
    <radialGradient id="shine" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#fff" stop-opacity="0.75" />
      <stop offset="0.35" stop-color="#fff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect class="bg" x="0" y="0" width="15" height="15" rx="0.35" />

  <!-- Yards -->
  @for (color of colors; track color) {
    <g class="yard" [class]="color" [class.unused]="!inGame(color)" [class.turn]="game().current === color">
      <rect class="yard-outer" [attr.x]="yardOrigin[color][0] + 0.08" [attr.y]="yardOrigin[color][1] + 0.08" width="5.84" height="5.84" rx="0.3" />
      <rect class="yard-inner" [attr.x]="yardOrigin[color][0] + 0.9" [attr.y]="yardOrigin[color][1] + 0.9" width="4.2" height="4.2" rx="0.35" />
      @for (s of yardSlots; track s) {
        <circle
          class="slot"
          [attr.cx]="yardOrigin[color][0] + (s % 2 === 0 ? 2 : 4)"
          [attr.cy]="yardOrigin[color][1] + (s < 2 ? 2 : 4)"
          r="0.55"
        />
      }
      @if (nameFor(color)) {
        <text class="yard-name" [attr.x]="yardOrigin[color][0] + 3" [attr.y]="yardOrigin[color][1] + 5.55">
          {{ nameFor(color) }}
        </text>
      }
    </g>
  }

  <!-- Track -->
  @for (sq of track; track $index) {
    <rect class="cell" [class]="sq.startOf ?? ''" [attr.x]="sq.cell[0]" [attr.y]="sq.cell[1]" width="1" height="1" />
    @if (sq.safe && !sq.startOf) {
      <text class="star" [attr.x]="sq.cell[0] + 0.5" [attr.y]="sq.cell[1] + 0.53">★</text>
    }
  }

  <!-- Home columns -->
  @for (h of homeColumns; track $index) {
    <rect class="cell home" [class]="h.color" [attr.x]="h.cell[0]" [attr.y]="h.cell[1]" width="1" height="1" />
  }

  <!-- Centre -->
  <g class="centre">
    <polygon class="red" points="6,6 6,9 7.5,7.5" />
    <polygon class="green" points="6,6 9,6 7.5,7.5" />
    <polygon class="yellow" points="9,6 9,9 7.5,7.5" />
    <polygon class="blue" points="6,9 9,9 7.5,7.5" />
  </g>

  <!-- Move preview -->
  @if (ghost(); as g) {
    <circle class="ghost" [class]="g.color" [attr.cx]="g.x" [attr.cy]="g.y" r="0.36" />
  }

  <!-- Pieces -->
  @for (p of pieces(); track p.key) {
    <g
      class="piece"
      [class]="p.color"
      [class.movable]="p.movable"
      [style.transform]="transform(p)"
      (click)="onPiece(p)"
      (pointerenter)="p.movable && hovered.set(p.piece)"
      (pointerleave)="hovered.set(null)"
      [attr.role]="p.movable ? 'button' : null"
      [attr.tabindex]="p.movable ? 0 : null"
      [attr.aria-label]="p.movable ? 'Move ' + p.color + ' piece ' + (p.piece + 1) : null"
      (keydown.enter)="onPiece(p)"
      (keydown.space)="onPiece(p); $event.preventDefault()"
    >
      @if (p.movable) {
        <circle class="halo" r="0.48" />
      }
      <ellipse class="shadow" cx="0" cy="0.22" rx="0.32" ry="0.14" />
      <circle class="body" r="0.34" />
      <circle class="top" r="0.2" cy="-0.04" />
      <circle class="shine" r="0.34" fill="url(#shine)" />
    </g>
  }
</svg>
